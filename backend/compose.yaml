# Local PostgreSQL for development: docker compose up -d
# Host port 5433 avoids clashing with a locally installed PostgreSQL on 5432, and it is bound to
# 127.0.0.1 so other machines on the network cannot reach this database.
name: audeat

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: audeat
      POSTGRES_USER: audeat
      POSTGRES_PASSWORD: audeat
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/<major>/.
      - audeat-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audeat -d audeat"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  audeat-postgres:
