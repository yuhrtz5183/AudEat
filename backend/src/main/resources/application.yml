# Production defaults. Every secret comes from the environment; startup fails if one is missing.
# For local development run with the "dev" profile (see README.md).
spring:
  application:
    name: audeat-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Safety net against lazy N+1 queries in the list assemblers.
      hibernate.default_batch_fetch_size: 50
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 26MB

server:
  tomcat:
    # Reads past an oversized upload so the client gets the 413 JSON body, not a connection reset.
    max-swallow-size: 30MB

audeat:
  jwt:
    secret: ${AUDEAT_JWT_SECRET}
    ttl: 12h
  cors:
    allowed-origins: ${AUDEAT_CORS_ORIGINS:}
